# ==============================================================================
# Dusky Updater Master Settings Configuration
# Path: profiles/settings/update_dusky.toml
# ==============================================================================
# This file decouples all system and UI settings for the Dusky Updater.
# All path options support:
#   - Relative subpaths under user home (e.g., "Documents" -> ~/Documents)
#   - Tilde expansion (e.g., "~/Pictures/files/history")
#   - Absolute paths (e.g., "/var/log/dusky")
# ==============================================================================

# ------------------------------------------------------------------------------
# UI & VISUAL DISPLAY SETTINGS
# ------------------------------------------------------------------------------
[ui]
# Render in plain ASCII mode if set to true
ascii_mode = false

# Initial width percentage of the left task sidebar (15 to 80)
sidebar_width = 35

# Maximum line buffer limit for TUI RichLog widgets (prevents unbounded memory growth)
max_log_lines = 6000

# Ordered list of relative or absolute paths to search for Matugen-generated TUI theme JSON files
theme_paths = [
    ".config/matugen/generated/dusky_tui.json",
    ".config/matugen/generated_fresh/dusky_tui.json",
]

# Fallback color palette (in Hex) used if no Matugen theme file is found
[ui.default_palette]
bg = "#1a110e"
fg = "#f1dfd9"
accent = "#ffb59b"
warning = "#e7bdaf"
success = "#d5c68e"
muted = "#53433e"
error = "#ffb4ab"

# Unicode status icons
[ui.unicode_symbols]
logo = "◈"
completed = "✓"
running = "◉"
failed = "✗"
skipped = "-"
pending = "○"

# Plain ASCII alternative symbols used when ascii_mode = true
[ui.ascii_symbols]
logo = "DUSKY"
completed = "OK"
running = "RUN"
failed = "ERR"
skipped = "SKIP"
pending = "..."


# ------------------------------------------------------------------------------
# PATHS & DIRECTORY STRUCTURE
# ------------------------------------------------------------------------------
[paths]
# Root documents directory. Change to any relative, tilde (~/...), or absolute path.
# Examples: "Documents", "~/Pictures/files/history", "/var/log/dusky"
documents_dir = "Documents"

# Application namespace used under /run/user/<uid>/ and ~/.cache/
namespace = "dusky-updater"

# Single-instance lock filename created inside the runtime directory
lock_file = "lock"

# Prefix used for temporary askpass helper scripts inside askpass directory
askpass_prefix = ".dusky_askpass_"

# Subdirectory under documents_dir where execution log files are stored
logs_subdir = "logs"

# Subdirectory under documents_dir where Git update backups are saved
backups_subdir = "dusky_backups"

# Persistent state subdirectory under documents_dir where SQLite StateStore and OnceStore reside
state_subdir = "state"

# Automatic retention policy: delete log files older than this many days (0 to disable)
log_retention_days = 14

# Automatic retention policy: delete backup directories older than this many days (0 to disable)
backup_retention_days = 14


# ------------------------------------------------------------------------------
# LOGGING TOGGLES
# ------------------------------------------------------------------------------
[logging]
# Set to false to completely turn off writing log files under ~/Documents/logs/
enabled = true

# Toggle writing individual per-task output log files
write_task_logs = true

# Toggle writing JSON/Markdown summary report files after runs
write_reports = true


# ------------------------------------------------------------------------------
# EXECUTION & DISK TUNING
# ------------------------------------------------------------------------------
[execution]
# Minimum required free disk space in megabytes before starting update pipeline
disk_min_free_mb = 100

# Reserve free disk space in megabytes when making file copies or CoW backups
disk_copy_reserve_mb = 64

# SQLite WAL database busy timeout in milliseconds
db_busy_timeout = 5000

# Default interpreter for extensionless scripts or unmapped file suffixes
default_interpreter = "bash"

# Script extension to interpreter binary mapping
[execution.extension_interpreters]
".py" = "python3"
".sh" = "bash"
".fish" = "fish"


# ------------------------------------------------------------------------------
# SYSTEM CONDITIONS & HARDWARE MAPS
# ------------------------------------------------------------------------------
[conditions]
# Command array used to check if a system package is installed
package_check_cmd = ["pacman", "-Qq"]

# Command array used to check if a systemd system service is active
service_active_cmd = ["systemctl", "is-active", "--quiet"]

# Command array used to check if a systemd user service is active
user_service_active_cmd = ["systemctl", "--user", "is-active", "--quiet"]

# Map of GPU vendor keywords to PCI vendor hex strings for hardware condition checks
[conditions.gpu_vendor_map]
nvidia = "0x10de"
intel = "0x8086"
amd = "0x1002"
vmware = "0x15ad"
virtio = "0x1af4"


# ------------------------------------------------------------------------------
# NOTIFICATIONS & AUDIO ALERTS
# ------------------------------------------------------------------------------
[notifications]
# Toggle desktop popup notifications via notify-send
desktop_enabled = true

# Application name displayed in desktop notification banners
app_name = "Dusky Updater"

# Toggle audio sound cues on pipeline completion or alert
audio_enabled = true

# Prioritized list of audio player binaries to use for sound playback
audio_players = ["pw-play", "paplay"]

# Fallback audio file path if configured sound file is missing
fallback_sound = "/usr/share/sounds/freedesktop/stereo/bell.oga"

# Sound file mapping for pipeline event sound cues
[notifications.sound_map]
alert = "/usr/share/sounds/freedesktop/stereo/dialog-warning.oga"
info = "/usr/share/sounds/freedesktop/stereo/dialog-information.oga"
complete = "/usr/share/sounds/freedesktop/stereo/complete.oga"


# ------------------------------------------------------------------------------
# SUDO & PRIVILEGE ESCALATION
# ------------------------------------------------------------------------------
[sudo]
# Background sudo credential keep-alive ping interval in seconds
heartbeat_interval = 60

# Prefix for PID-scoped temporary sudoers drop-in files
dropin_prefix = "99_dusky_"

# System sudoers drop-in directory
sudoers_dir = "/etc/sudoers.d"

# Sudo timestamp timeout in minutes
timestamp_timeout = 15

# Environment variables preserved during sudo escalation
env_keep = [
    "HOME", "USER", "LOGNAME", "SHELL", "PATH", "TERM", "COLORTERM",
    "LANG", "LC_ALL", "LC_CTYPE", "TZ", "XDG_RUNTIME_DIR", "XDG_CONFIG_HOME",
    "XDG_CACHE_HOME", "XDG_STATE_HOME", "XDG_DATA_HOME", "XDG_SESSION_TYPE",
    "XDG_CURRENT_DESKTOP", "DBUS_SESSION_BUS_ADDRESS", "DISPLAY",
    "WAYLAND_DISPLAY", "XAUTHORITY", "SSH_AUTH_SOCK", "SSH_AGENT_PID",
    "PYTHONUNBUFFERED", "PYTHONUTF8", "PYTHONDONTWRITEBYTECODE", "ZDOTDIR",
    "HYPRLAND_INSTANCE_SIGNATURE", "QT_QPA_PLATFORM", "XDG_SESSION_ID", "XDG_SEAT"
]


# ------------------------------------------------------------------------------
# GIT SYNCHRONIZATION ENGINE
# ------------------------------------------------------------------------------
[git]
# Upstream tracking branch
branch = "main"

# Default git repository URL
repo_url = "https://github.com/dusklinux/dusky"

# Timeout in seconds for git fetch commands
fetch_timeout = 60

# Maximum git fetch retry attempts on network failures
fetch_max_attempts = 5

# Timeout in seconds for git clone commands
clone_timeout = 120

# Maximum git clone retry attempts on network failures
clone_max_attempts = 5

# Keys stripped from environment during git subprocess invocations to prevent hangs
env_strip = ["GIT_DIR", "GIT_WORK_TREE", "GIT_INDEX_FILE", "GIT_LITERAL_PATHSPECS", "GIT_ASKPASS", "SSH_ASKPASS"]

# Environment variables injected during git subprocess execution
[git.env_inject]
GIT_TERMINAL_PROMPT = "0"
GIT_SSH_COMMAND = "ssh -o BatchMode=yes"
GIT_PAGER = "cat"
PAGER = "cat"
GIT_OPTIONAL_LOCKS = "0"


# ------------------------------------------------------------------------------
# AUTOMATED INTERACTIVE PROMPTS
# ------------------------------------------------------------------------------
[prompts]
# Minimum delay in seconds between auto-responding to matching interactive prompt patterns
cooldown = 0.35

[[prompts.rules]]
name = "sudo_password"
pattern = "(?i)(\\[sudo\\] password for [^:]+:|^\\s*Password:\\s*$|sudo: a password is required|Password:\\s*$)"
kind = "password"

[[prompts.rules]]
name = "pacman_proceed"
pattern = "(?i)::\\s*(Proceed with (?:installation|download|upgrade)|Continue (?:installation|download|upgrade)).*\\?\\s*\\[Y/n\\]"
kind = "yes"

[[prompts.rules]]
name = "generic_yes"
pattern = "(?i)\\[Y/n\\]|\\(Y/n\\)|\\[y/N\\]|\\(y/N\\)"
kind = "yes"
