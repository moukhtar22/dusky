# ==============================================================================
# Battlefield: Bad Company 2 Profile
# ==============================================================================
# Engine: Frostbite 1.5 (Windows via Wine)
# Target: BFBC2Game.exe (Frostbite) via Wine
# Notes: Classic DICE Frostbite shooter. Includes BFBC2Updater.exe, Dist/win32 levels

extends = "base_wine_dxvk"

[meta]
id = "battlefield_bad_company_2"
name = "Battlefield: Bad Company 2"
version = "1.0"
icon = "applications-games"
developer = "DICE"
genre = "FPS / Action"
description = "The definitive Frostbite-powered Battlefield experience. Join Bad Company in a high-stakes single-player campaign and large-scale multiplayer warfare."

[paths]
game_dir = "/mnt/media/games/unknown_quality/Battlefield.Bad.Company.2-jc141"
dwarfs_image = "files/game-root.dwarfs"
dwarfs_mount = "files/.game-root-mnt"
overlay_dir = "files/game-root"
overlay_storage = "files/overlay-storage"
overlay_work = "files/.game-root-work"
executable = "BFBC2Game.exe"
arguments = []

[runtime]
type = "wine"

[runtime.wine]
prefix_dir = "files/wine-prefix-ew"
arch = "win64"
sync_mode = "fsync"
dxvk = true
vkd3d = true

[runtime.wine.dll_overrides]
"winemenubuilder.exe" = "d"
mshtml = "d"
dxgi = "n,b"
d3d11 = "n,b"
d3d12 = "n,b"
d3d9 = "n,b"

[graphics]
gpu = "discrete"
wayland_native = true

[graphics.gamescope]
enabled = false

[performance]
gamemode = true
mangohud = false
fps_limit = 60
