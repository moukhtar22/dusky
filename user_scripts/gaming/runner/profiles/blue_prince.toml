# ==============================================================================
# Blue Prince Profile
# Engine: Unity IL2CPP (Windows x64) via Wine-Staging + DXVK
# ==============================================================================

extends = "base_wine_dxvk"

[meta]
id = "blue_prince"
name = "Blue Prince"
version = "1.0"
icon = "applications-games"
developer = "Dogubomb"
genre = "Puzzle / Adventure"
description = "Atmospheric puzzle-adventure through the shifting rooms of Mt. Holly manor. Draft blueprints, solve riddles, and chase Room 46."

[paths]
game_dir = "/mnt/media/games/more_windows/Blue-Prince-AnkerGames"
executable = "Blue Prince/BLUE PRINCE.exe"
arguments = ["-force-d3d11"]

[runtime]
type = "wine"

[runtime.wine]
prefix_dir = "files/wine-prefix-blue-prince"
arch = "win64"
sync_mode = "fsync"
dxvk = true
vkd3d = true
redistributables = ["Redist/vc_redist.x64.exe"]
winetricks = []

[runtime.wine.dll_overrides]
"winemenubuilder.exe" = "d"
mshtml = "d"
dxgi = "n,b"
d3d11 = "n,b"
d3d12 = "n,b"
d3d9 = "n,b"

[graphics]
gpu = "auto"
wayland_native = true

[graphics.gamescope]
enabled = false

[performance]
gamemode = true
mangohud = false
fps_limit = 60
