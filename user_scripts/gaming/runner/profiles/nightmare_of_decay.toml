# ==============================================================================
# Nightmare of Decay Profile
# ==============================================================================

extends = "base_wine_dxvk"

[meta]
id = "nightmare_of_decay"
name = "Nightmare of Decay"
version = "1.0"
icon = "applications-games"
developer = "Checkmaty"
genre = "Horror / FPS"
description = "PS1-styled survival horror FPS inspired by classic Resident Evil - scavenge, survive and escape a house of nightmares."

[paths]
game_dir = "/mnt/media/games/unknown_quality/Nightmare.of.Decay-jc141"
dwarfs_image = "files/game-root.dwarfs"
dwarfs_mount = "files/.game-root-mnt"
overlay_dir = "files/game-root"
overlay_storage = "files/overlay-storage"
overlay_work = "files/.game-root-work"
executable = "NightmareOfDecay.exe"
arguments = []

[runtime]
type = "wine"

[runtime.wine]
prefix_dir = "files/wine-prefix-ew"
arch = "win64"
sync_mode = "fsync"
dxvk = true
vkd3d = true

[runtime.wine.dll_overrides]
"winemenubuilder.exe" = "d"
mshtml = "d"
dxgi = "n,b"
d3d11 = "n,b"
d3d12 = "n,b"
d3d9 = "n,b"

[graphics]
gpu = "discrete"
wayland_native = true

[graphics.gamescope]
enabled = false

[performance]
gamemode = true
mangohud = false
fps_limit = 60
