# ==============================================================================
# Ikenfell Profile
# ==============================================================================
# Engine: Custom (GameMaker/MonoGame) Windows via ColdClientLoader + wine-mono.
# Notes: Uses local prefix $PWD/files/prefix and x86 loader. Requires wine-mono MSI on first provision.

extends = "base_wine_dxvk"

[meta]
id = "ikenfell"
name = "Ikenfell"
version = "1.0"
icon = "applications-games"
developer = "Happy Ray Games"
genre = "RPG / Tactical"
description = "Turn-based tactical RPG about troubled students at a magical school. Time your hits and blocks for tactical advantage in grid-based combat."

[paths]
game_dir = "/mnt/media/games/unknown_quality/Ikenfell-jc141"
dwarfs_image = "files/game-root.dwarfs"
dwarfs_mount = "files/.game-root-mnt"
overlay_dir = "files/game-root"
overlay_storage = "files/overlay-storage"
overlay_work = "files/.game-root-work"
executable = "IkenfellWin.exe"
arguments = []

[runtime]
type = "wine"

[runtime.wine]
prefix_dir = "files/prefix"
arch = "win64"
sync_mode = "fsync"
dxvk = true
vkd3d = true
redistributables = ["$GAME_DIR/files/wine-mono-10.3.0-x86.msi"]

[runtime.wine.dll_overrides]
"winemenubuilder.exe" = "d"
mshtml = "d"
dxgi = "n,b"
d3d11 = "n,b"
d3d12 = "n,b"
d3d9 = "n,b"

[graphics]
gpu = "auto"
wayland_native = true

[graphics.gamescope]
enabled = false

[performance]
gamemode = true
mangohud = false
fps_limit = 60
