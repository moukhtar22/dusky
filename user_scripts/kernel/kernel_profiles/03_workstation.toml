# Workstation: Throughput-first, NUMA/CXL aware, IOPOLL, layered SCX
# generated by Dusky Kernel Compiler 5.0.0

[meta]
name = "workstation"
description = "Workstation: Throughput-first, NUMA/CXL aware, IOPOLL, layered SCX"
suffix = "dusky-compute"
priority = 30
tags = []
bare_metal_only = false
portable_package = false

[release]
channel = "stable"
pin = ""
allow_rc = false
min_version = "7.2"

[scheduler]
type = "eevdf"
scx = "scx_layered"
scx_flags = ""
scx_enable_class = true
require_patch = false
autogroup = false
rt_group = true
allow_vanilla_fallback = true

[cache]
sched_cache = true
llc_aggr_tolerance = 20
persist = true

[rseq]
slice_extension = true
slice_ext_nsec = 20000

[dusky]
enhanced = false
hostname = "dusky"
user = "dusky"
reproducible = true
extra_config = {}

[cpu]
arch = "native"
march = ""
governor = "schedutil"
amd_pstate = "active"
epp = "performance"
mitigations = true
nr_cpus = 0
smt = true
mce = true
prefcore = true

[timing]
hz = 500
tickless = "idle"
preempt = "lazy"
preempt_dynamic = true
hz_periodic_rcu = false

[memory]
thp = "madvise"
thp_defrag = "defer"
thp_shmem = "advise"
mglru = true
mglru_mask = 7
mglru_min_ttl_ms = 0
watermark_scale_factor = 200
watermark_boost_factor = 0
compaction_proactiveness = 0
swap_backend = "zram"
zswap_compressor = "zstd"
zswap_zpool = "zsmalloc"
zram_size_pct = 100
zram_multi_comp = true
slub_tiny = false
numa = true
numa_balancing = true
nodes_shift = 6
ksm = true
damon = true
page_reporting = true

[compiler]
toolchain = "llvm"
optimize = "o2"
allow_unsupported_o3 = false
lto = "thin"
thinlto_cache = true
thinlto_cache_size = "20g"
fdo = "none"
fdo_profile_dir = ""
kcfi = false
zstd_clevel = 19
module_compress = "zstd"
debug_info = "reduced"
jobs = 0
rust = true
headers = "auto"

[security]
profile = "balanced"
init_on_alloc = true
hardened_usercopy = true
stackprotector = "strong"
slab_freelist_hardened = true
randomize_kstack = true
mitigations = "auto"
acknowledge_risk = false

[gaming]
ntsync = true
uclamp = true
max_map_count = 2147483642
split_lock_mitigate = false

[storage]
nvme_poll_queues = 8
io_scheduler = "none"
blk_wbt = true

[power]
